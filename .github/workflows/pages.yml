name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Extract website
        run: unzip -q luc1fer-ivy.github.io.zip -d website

      - name: Build and check
        working-directory: website/luc1fer-ivy.github.io
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/build.mjs
          node scripts/check.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/luc1fer-ivy.github.io/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
